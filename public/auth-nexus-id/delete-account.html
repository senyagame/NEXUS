<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрос на Удаление Аккаунта</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" href="./assets/nid-favicon.png" type="image/x-icon">
    <style>
        body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-image:url(./assets/auth_mountains.jpg);background-size:cover;background-position:center;background-repeat:no-repeat}.container{color:#000;background-color:rgba(255,255,255);padding:20px;border-radius:30px;box-shadow:0 0 10px rgba(0,0,0,.3);width:300px;text-align:center;margin:0}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:5px;text-align:left}.form-group input{width:100%;padding:8px;box-sizing:border-box;border-radius:4px;border:1px solid #ccc;background-color:#e4e4e4;color:#000}.form-group button{width:100%;padding:10px;background-color:#007BFF;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-top:10px}.form-group button:hover{background-color:#0056b3}.toggle-link{margin-top:10px}.toggle-link a{color:#007BFF;text-decoration:none}.toggle-link a:hover{text-decoration:underline}.back-to-profile{display:block;margin-top:20px;color:#007BFF;text-decoration:none}.back-to-profile:hover{text-decoration:underline}.message{margin-top:10px;padding:8px;border-radius:4px;display:none;font-size:.9em;text-align:center}.message.error{color:#d8000c;background-color:#ffbaba;border:1px solid #d8000c}.message.success{color:#4F8A10;background-color:#DFF2BF;border:1px solid #4F8A10}.NID-logo{width:190px;height:auto;margin-bottom:20px}#auth-section{display:block}#user-dashboard{display:none}#loading-spinner{display:none;border:4px solid rgba(0,0,0,.1);border-top:4px solid #007BFF;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin:10px auto}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
    <div class="container">
        <div id="auth-section">
            <img src="./assets/NID-long-logo.png" alt="Nexus ID Logo" class="NID-logo">
            <div id="delete-account-form">
                <h2>Удаление аккаунта</h2>
                <a href="./profile.html" class="toggle-link">Вернуться в профиль</a>
                <p>Вы вошли как: <span id="user-email">Загрузка...</span></p>
                <div class="form-group">
                    <label for="delete-account-password">Введите ваш пароль для подтверждения:</label>
                    <input type="password" id="delete-account-password" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <label for="delete-account-confirm">Напишите: <strong>Я хочу удалить аккаунт</strong></label>
                    <input type="text" id="delete-account-confirm" placeholder="Я хочу удалить аккаунт" required>
                </div>
                <button id="delete-account-button">Отправить запрос на отключение</button>
                <div id="loading-spinner"></div>
                <div id="delete-account-message" class="message"></div>
            </div>
        </div>
    </div>


    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAP04srkFeyQPsp1iuhn0RwzMav9fhqCRw",
            authDomain: "nexus-90a19.firebaseapp.com",
            projectId: "nexus-90a19",
            storageBucket: "nexus-90a19.appspot.com", // Убрал .firebasestorage.app, должно быть .appspot.com
            messagingSenderId: "327211386840", // Исправил на правильный ID
            appId: "1:327211386840:web:69110e5b7fd7e7f3b69327", // Исправил на правильный ID
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const userEmailSpan = document.getElementById('user-email');
        const deleteAccountPasswordInput = document.getElementById('delete-account-password');
        const deleteAccountConfirmInput = document.getElementById('delete-account-confirm');
        const deleteAccountButton = document.getElementById('delete-account-button');
        const deleteAccountMessage = document.getElementById('delete-account-message');
        const loadingSpinner = document.getElementById('loading-spinner');

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `message ${type}`;
            element.style.display = 'block';
        }

        function setFormLoading(isLoading) {
            deleteAccountButton.disabled = isLoading;
            loadingSpinner.style.display = isLoading ? 'block' : 'none';
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                userEmailSpan.textContent = user.email;
            } else {
                console.log("Пользователь не авторизован. Перенаправление на auth.html");
                window.location.href = './auth.html';
            }
        });

        deleteAccountButton.addEventListener('click', async () => {
            setFormLoading(true);
            showMessage(deleteAccountMessage, '', 'none');

            const password = deleteAccountPasswordInput.value;
            const confirmText = deleteAccountConfirmInput.value;
            const requiredConfirmText = "Я хочу удалить аккаунт";

            if (!password || !confirmText) {
                showMessage(deleteAccountMessage, 'Пожалуйста, заполните все поля.', 'error');
                setFormLoading(false);
                return;
            }

            if (confirmText !== requiredConfirmText) {
                showMessage(deleteAccountMessage, `Пожалуйста, точно напишите "${requiredConfirmText}".`, 'error');
                setFormLoading(false);
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showMessage(deleteAccountMessage, 'Пользователь не авторизован.', 'error');
                setFormLoading(false);
                return;
            }

            const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
            try {
                await user.reauthenticateWithCredential(credential);
                
                await db.collection('delete-users').add({
                    uid: user.uid,
                    email: user.email,
                    content_confirm: confirmText,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending'
                });

                showMessage(deleteAccountMessage, 'Ваш запрос на отключение аккаунта отправлен. Вы будете перенаправлены через 5 секунд.', 'success');
                
                setTimeout(() => {
                    auth.signOut();
                    window.location.href = './auth.html';
                }, 5000);

            } catch (error) {
                console.error('Ошибка при отправке запроса:', error);
                let errorMessage = 'Произошла ошибка.';
                if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Неверный пароль. Пожалуйста, проверьте и попробуйте еще раз.';
                }
                showMessage(deleteAccountMessage, errorMessage, 'error');
            } finally {
                setFormLoading(false);
            }
        });
    </script>
</body>
</html>
