<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Твои текущие стили, адаптированные для форм */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('./assets/auth_mountains.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .container {
            color: #000000;
            background-color: rgba(255, 255, 255);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            text-align: left; /* Выравнивание текста метки влево */
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #e4e4e4;
            color: #000000;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .form-group button:hover {
            background-color: #0056b3;
        }
        .toggle-link {
            margin-top: 10px;
        }
        .toggle-link a {
            color: #cfe6ff;
            text-decoration: none;
        }
        .toggle-link a:hover {
            text-decoration: underline;
        }
        .back-to-profile {
            display: block;
            margin-top: 20px;
            color: #cfe6ff;
            text-decoration: none;
        }
        .back-to-profile:hover {
            text-decoration: underline;
        }
        .message { /* ОБЩИЙ КЛАСС ДЛЯ СООБЩЕНИЙ */
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            display: none; /* По умолчанию скрыто */
            font-size: 0.9em;
        }
        .message.error {
            color: #ff4d4d;
            background-color: rgba(255, 77, 77, 0.2);
            border: 1px solid #ff4d4d;
        }
        .message.success {
            color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }
        .NID-logo {
            width: 190px;
            height: auto;
            margin-bottom: 20px;
        }
        /* Стили для скрытия/показа форм и user-dashboard */
        #auth-section { display: block; }
        #user-dashboard { display: none; } /* По умолчанию скрыто */
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    </head>
<body>
    <div class="container">
        <div id="auth-section">
            <img class="NID-logo" src="./assets/NID-long-logo.png" alt="N-ID Logo">

            <div id="login-form">
                <h2>Авторизация</h2>
                <div class="form-group">
                    <label for="login-email">Email / Логин / Номер телефона:</label>
                    <input type="text" id="login-email" placeholder="Email / Логин / Номер телефона" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль:</label>
                    <input type="password" id="login-password" placeholder="Пароль" required>
                </div>
                <button id="login-button">Авторизироваться в NEXUS</button>
                <div id="login-message" class="message"></div> <div class="toggle-link">
                    <a href="#" id="show-register-form-link" style="color: #000000;">Нет N-ID? Зарегистрируйтесь тут!</a>
                </div>
            </div>

            <div id="register-form" style="display: none;">
                <h2>Регистрация N-ID</h2>
                <div class="form-group">
                    <label for="register-username">Придумайте логин:</label>
                    <input type="text" id="register-username" placeholder="Ваш логин" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="register-phone">Номер телефона (необязательно):</label>
                    <input type="tel" id="register-phone" placeholder="+7 (XXX) XXX-XX-XX">
                </div>
                <div class="form-group">
                    <label for="register-password">Придумайте пароль:</label>
                    <input type="password" id="register-password" placeholder="Пароль (мин. 6 символов)" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Подтвердите пароль:</label>
                    <input type="password" id="register-confirm-password" placeholder="Подтвердите пароль" required>
                </div>
                <button id="register-button">Зарегистрироваться</button>
                <div id="register-message" class="message"></div> <div class="toggle-link">
                    <a href="#" id="show-login-form-link" style="color: #000000;">Уже есть N-ID? Авторизируйтесь тут!</a>
                </div>
            </div>
        </div>

        <div id="user-dashboard">
            <img class="NID-logo" src="./assets/NID-long-logo-2.png" alt="S-ID Logo">
            <h2>Добро пожаловать, <span id="user-display-name">Пользователь</span>!</h2>
            <p>Вы вошли как: <span id="user-email"></span></p>
            <button id="logout-button">Выйти из S-ID</button>
        </div>
        <a href="profile.html" id="back-to-profile-link" class="back-to-profile" style="display: none; color: #000000; font-weight: 700;">Вернуться в профиль</a>
    </div>
    <script>
        // Инициализация Firebase SDK
        const firebaseConfig = {
            apiKey: "AIzaSyAP04srkFeyQPsp1iuhn0RwzMav9fhqCRw",
            authDomain: "nexus-90a19.firebaseapp.com",
            projectId: "nexus-90a19",
            storageBucket: "nexus-90a19.firebasestorage.app",
            messagingSenderId: "78051357921",
            appId: "1:78051357921:web:477ab2794b67e0c706b3a0",
            measurementId: "G-X65550ENG3"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Элементы DOM ---
        const authSection = document.getElementById('auth-section');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const userDashboard = document.getElementById('user-dashboard');

        // ИЗМЕНЕНО: теперь это поле для email/логина/телефона
        const loginIdentifierInput = document.getElementById('login-email'); // Оставляем ID 'login-email', но будем использовать для разных типов ввода
        loginIdentifierInput.placeholder = "Email / Логин / Номер телефона"; // Обновляем плейсхолдер

        const loginPasswordInput = document.getElementById('login-password');
        const loginButton = document.getElementById('login-button');
        const loginMessage = document.getElementById('login-message');

        const registerUsernameInput = document.getElementById('register-username');
        const registerEmailInput = document.getElementById('register-email');
        const registerPhoneInput = document.getElementById('register-phone');
        const registerPasswordInput = document.getElementById('register-password');
        const registerConfirmPasswordInput = document.getElementById('register-confirm-password');
        const registerButton = document.getElementById('register-button');
        const registerMessage = document.getElementById('register-message');

        const showRegisterFormLink = document.getElementById('show-register-form-link');
        const showLoginFormLink = document.getElementById('show-login-form-link');

        const userDisplayNameSpan = document.getElementById('user-display-name');
        const userEmailSpan = document.getElementById('user-email');
        const userUidSpan = document.getElementById('user-uid');
        const logoutButton = document.getElementById('logout-button');
        const backToProfileLink = document.getElementById('back-to-profile-link');


        // --- Вспомогательные функции UI ---
        function showMessage(element, message, type) {
            if (!element) {
                console.error(`Элемент для сообщения не найден: ${message}`);
                return;
            }
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
                element.textContent = '';
            }, 5000);
        }

        function showAuthForm(formToShow) {
            if (!loginForm || !registerForm) {
                console.error("Один из элементов формы (loginForm или registerForm) не найден.");
                return;
            }

            if (formToShow === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else if (formToShow === 'register') {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
            loginMessage.style.display = 'none';
            registerMessage.style.display = 'none';
        }

        // --- Обработчики событий для переключения форм ---
        if (showRegisterFormLink) {
            showRegisterFormLink.addEventListener('click', (e) => {
                e.preventDefault();
                console.log("Нажата ссылка 'Зарегистрироваться'.");
                showAuthForm('register');
            });
        } else {
            console.error("Элемент с ID 'show-register-form-link' не найден в DOM.");
        }

        if (showLoginFormLink) {
            showLoginFormLink.addEventListener('click', (e) => {
                e.preventDefault();
                console.log("Нажата ссылка 'Авторизоваться'.");
                showAuthForm('login');
            });
        } else {
            console.error("Элемент с ID 'show-login-form-link' не найден в DOM.");
        }

        // --- Функции Firebase Authentication ---

        registerButton.addEventListener('click', async (event) => {
            event.preventDefault();

            const username = registerUsernameInput.value.trim();
            const email = registerEmailInput.value.trim();
            const password = registerPasswordInput.value;
            const confirmPassword = registerConfirmPasswordInput.value;
            const phoneNumber = registerPhoneInput.value.trim();

            if (!username || !email || !password || !confirmPassword) {
                showMessage(registerMessage, "Пожалуйста, заполните все обязательные поля.", "error");
                return;
            }
            if (password !== confirmPassword) {
                showMessage(registerMessage, "Пароли не совпадают!", "error");
                return;
            }
            if (password.length < 6) {
                showMessage(registerMessage, "Пароль должен быть не менее 6 символов.", "error");
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                await user.updateProfile({
                    displayName: username
                });

                const userDocRef = db.collection("users").doc(user.uid);
                await userDocRef.set({
                    username: username,
                    email: email,
                    phoneNumber: phoneNumber,
                    avatarUrl: "",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                showMessage(registerMessage, "Регистрация успешна! Вы вошли в систему.", "success");
                console.log("Пользователь зарегистрирован и его профиль создан в Firestore:", user.uid, username);

                window.location.href = "profile.html";

            } catch (error) {
                let errorMessage = "Произошла ошибка при регистрации.";
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'Этот Email уже используется.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Некорректный формат Email.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Пароль слишком слабый (минимум 6 символов).';
                        break;
                    default:
                        errorMessage = `Ошибка: ${error.message}`;
                }
                console.error("Ошибка регистрации:", error.code, error.message);
                showMessage(registerMessage, errorMessage, "error");
            }
        });

        loginButton.addEventListener('click', async (event) => {
            event.preventDefault();

            const identifier = loginIdentifierInput.value.trim(); // Получаем значение из поля
            const password = loginPasswordInput.value;

            if (!identifier || !password) {
                showMessage(loginMessage, "Пожалуйста, введите Email / Логин / Номер телефона и пароль.", "error");
                return;
            }

            try {
                let emailToSignIn = identifier;

                // Если введенное значение НЕ похоже на email, ищем в Firestore
                // Простая проверка на @ и .
                if (!identifier.includes('@') || !identifier.includes('.')) {
                    console.log(`Ищем пользователя по логину или телефону: ${identifier}`);
                    const usersRef = db.collection('users');
                    let querySnapshot;

                    // Попытка найти по username
                    querySnapshot = await usersRef.where('username', '==', identifier).limit(1).get();
                    
                    // Если не нашли по username, ищем по phoneNumber
                    if (querySnapshot.empty) {
                        querySnapshot = await usersRef.where('phoneNumber', '==', identifier).limit(1).get();
                    }

                    if (!querySnapshot.empty) {
                        const userData = querySnapshot.docs[0].data();
                        emailToSignIn = userData.email; // Получаем email найденного пользователя
                        console.log(`Найден пользователь по идентификатору: ${identifier}, его email: ${emailToSignIn}`);
                    } else {
                        // Если не нашли пользователя ни по логину, ни по телефону
                        showMessage(loginMessage, "Пользователь с таким логином или номером телефона не найден.", "error");
                        return;
                    }
                }

                // Теперь используем найденный email (или исходный email, если он был введен) для входа
                await auth.signInWithEmailAndPassword(emailToSignIn, password);
                showMessage(loginMessage, "Вход успешен!", "success");

                window.location.href = "profile.html";

            } catch (error) {
                let errorMessage = "Произошла ошибка при входе.";
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'Некорректный формат Email.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'Пользователь заблокирован.';
                        break;
                    case 'auth/user-not-found': // Эта ошибка Firebase может быть вызвана, если email, полученный из Firestore, не соответствует пользователю в Authentication
                        errorMessage = 'Неверные данные для входа.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Неверный пароль.';
                        break;
                    default:
                        errorMessage = `Ошибка: ${error.message}`;
                }
                console.error("Ошибка входа:", error.code, error.message);
                showMessage(loginMessage, errorMessage, "error");
            }
        });

        logoutButton.addEventListener('click', async () => {
            try {
                await auth.signOut();
                console.log("Пользователь вышел.");
                window.location.href = "auth.html"; 

            } catch (error) {
                console.error("Ошибка выхода:", error.message);
            }
        });

        // --- Обработчик состояния аутентификации ---
        auth.onAuthStateChanged((user) => {
            if (!authSection || !userDashboard || !backToProfileLink) {
                console.error("Один из основных элементов UI (authSection, userDashboard, backToProfileLink) не найден.");
                return;
            }

            if (user) {
                authSection.style.display = 'none';
                userDashboard.style.display = 'block';
                backToProfileLink.style.display = 'block';

                userDisplayNameSpan.textContent = user.displayName || 'Неизвестный пользователь';
                userEmailSpan.textContent = user.email;
                userUidSpan.textContent = user.uid;

                console.log("Пользователь вошел:", user.email, "UID:", user.uid, "DisplayName:", user.displayName);
                
            } else {
                authSection.style.display = 'block';
                userDashboard.style.display = 'none';
                backToProfileLink.style.display = 'none';
                showAuthForm('login');
                console.log("Пользователь вышел из системы.");
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (!auth.currentUser) {
                showAuthForm('login');
            } else {
                authSection.style.display = 'none';
                userDashboard.style.display = 'block';
                backToProfileLink.style.display = 'block';
            }
        });
    </script>
</body>
</html>
