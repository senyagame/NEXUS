<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        /* 1. Общие стили для "ПК-приложения" */
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            color: #000000;
            line-height: 1.6;
            background-image: url('./assets/auth_mountains.jpg');
        }

        /* 2. Контейнер профиля - имитация окна приложения */
        .profile-container {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-container h2 {
            font-size: 2.2em;
            color: #000000;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .profile-avatar-display {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            border: 2px solid #686868;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            /* Добавил тень для аватара */
        }

        .profile-info {
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
        }

        .profile-info p {
            margin: 12px 0;
            font-size: 1.05em;
            color: #000000;
        }

        .profile-info strong {
            display: inline-block;
            width: 180px;
            text-align: right;
            margin-right: 15px;
            color: #000000;
        }

        /* 4. Кнопки (универсальный стиль) */
        .app-button {
            padding: 14px 30px;
            font-size: 1.15em;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 70%;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        .app-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .app-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Специфические цвета для кнопок */
        .primary-action-button {
            background-color: #007bff;
            color: #ffffff;
        }

        .primary-action-button:hover {
            background-color: #0069d9;
        }

        .danger-button {
            background-color: #dc3545;
            color: #ffffff;
        }

        .danger-button:hover {
            background-color: #c82333;
        }

        .success-button {
            background-color: #28a745;
            color: #ffffff;
        }

        .success-button:hover {
            background-color: #218838;
        }

        .back-button {
            display: block;
            margin-top: 40px;
            padding: 14px 30px;
            color: #fff;
            text-decoration: none;
            background-color: #4a4a5a;
            border-radius: 6px;
            font-size: 1.15em;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 70%;
            letter-spacing: 0.5px;
        }

        .back-button:hover {
            background-color: #5a5a6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .back-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* 5. Инпуты */
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="phone"] {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #2a2a3e;
            color: #f0f0f0;
            font-size: 1em;
            text-align: left;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="phone"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.3);
        }

        /* Стили для центрирования форм внутри модального окна */
        .modal-body .form-group {
            text-align: left;
            margin-left: auto;
            margin-right: auto;
            max-width: 80%;
            margin-bottom: 15px;
        }

        /* 6. Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #28283e;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 550px;
            color: #fff;
            position: relative;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
        }

        .modal-header img {
            width: 50px;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 0 10px rgba(0, 0, 0);
            background-color: rgba(255, 255, 255);
            margin-right: 10px;
        }

        .modal-header h3 {
            flex-grow: 1;
            margin: 0;
            text-align: center;
            font-size: 1.7em;
            color: #fff;
            font-weight: 600;
        }

        .close-button {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 2.2em;
            cursor: pointer;
            padding: 0 10px;
            transition: color 0.2s ease;
        }

        .close-button:hover {
            color: #ffffff;
        }

        .modal-body {
            padding-top: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-body .form-group label {
            display: block;
            margin-bottom: 5px;
            text-align: left;
            margin-left: 0;
            color: #e0e0e0;
            /* Светлый цвет для лейблов */
        }

        .modal-body .avatar-selection {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-body .avatar-selection p {
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .modal-body .avatar-selection img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            margin: 0 5px;
            border: 2px solid transparent;
            transition: border-color 0.2s ease, transform 0.1s ease;
        }

        .modal-body .avatar-selection img.selected {
            border-color: #007BFF;
            transform: scale(1.1);
        }

        .modal-body .avatar-selection img:hover:not(.selected) {
            border-color: #555;
            transform: scale(1.05);
        }

        .modal-footer {
            margin-top: 35px;
            text-align: center;
            border-top: 1px solid #444;
            padding-top: 25px;
        }

        .modal-footer p {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 15px;
        }

        /* Стили для видео-оверлея загрузки */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(255, 255, 255);
            /* Белый фон, как в твоем примере */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            /* Убедимся, что он поверх всего */
            transition: opacity 0.5s ease-out;
            /* Время исчезновения 2 секунды */
        }

        #loading-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Скрытие видео (для JavaScript) */
        .hidden {
            opacity: 0;
            pointer-events: none;
            /* Отключаем взаимодействие с элементами под оверлеем */
        }
                .header-logo {
            max-height: 50px;
            width: auto;
        }

        .header-logo-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .header-logo {
                display: none;
            }

            .header-logo-mobile {
                display: block;
                max-height: 80px;
                width: auto;
            }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

</head>

<body>
    <div id="video-overlay">
        <video id="loading-video" autoplay muted playsinline>
            <source src="./assets/NEXUS ID load.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <div class="profile-container">
        <div class="header-content">
            <img src="./assets/NID-long-logo.png" alt="Nexus ID Logo" class="header-logo">
        </div>
        <div class="header-content-mobile">
            <img src="./assets/NID-logo.png" alt="Nexus ID Logo" class="header-logo-mobile">
        </div>
        <h2>Личный кабинет</h2>
        <p id="user-info" style="margin-bottom: 15px; font-size: 0.9em; color: #000000;">N-ID привязан к почте: <span
                id="user-email"></span></p>

        <img id="current-profile-avatar" class="profile-avatar-display" src="./assets/default-avatar.jpg"
            alt="Ваш аватар">

        <div class="profile-info">
            <p><strong>Ваш логин:</strong> <span id="display-username">Загрузка...</span></p>
            <p><strong>Ваш номер телефона:</strong> <span id="display-phone">Загрузка...</span></p>
            <p style="display: none;"><strong>Ваш email:</strong> <span id="display-email">скрыт</span></p>
        </div>

        <button class="app-button primary-action-button" onclick="openEditModal()">Изменить</button>
        <button class="app-button danger-button" onclick="logout()">Выйти из аккаунта</button>
        <a href="home-page.html" class="back-button">Назад на главную</a>
    </div>

    <div id="edit-profile-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <img src="./assets/NID-logo.png" alt="N-ID Logo">
                <h3>Редактирование</h3>
                <button class="close-button" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="avatar-selection">
                    <p>Выберите аватар:</p>
                    <div
                        style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center;">
                        <img src="./assets/default-avatar.jpg" alt="Аватар по умолчанию"
                            data-avatar-url="./assets/default-avatar.jpg">
                        <img src="./assets/avatar1.jpg" alt="Аватар 1" data-avatar-url="./assets/avatar1.jpg">
                        <img src="./assets/avatar2.jpg" alt="Аватар 2" data-avatar-url="./assets/avatar2.jpg">
                        <img src="./assets/avatar3.jpg" alt="Аватар 3" data-avatar-url="./assets/avatar3.jpg">
                        <img src="./assets/avatar4.jpg" alt="Аватар 4" data-avatar-url="./assets/avatar4.jpg">
                        <img src="./assets/avatar5.jpg" alt="Аватар 5" data-avatar-url="./assets/avatar5.jpg">
                        <img src="./assets/avatar6.jpg" alt="Аватар 6" data-avatar-url="./assets/avatar6.jpg">
                        <img src="./assets/avatar7.jpg" alt="Аватар 7" data-avatar-url="./assets/avatar7.jpg">
                        <img src="./assets/avatar8.png" alt="Аватар 8" data-avatar-url="./assets/avatar8.png">
                        <img src="./assets/avatar9.png" alt="Аватар 9" data-avatar-url="./assets/avatar9.png">
                    </div>
                </div>
                <img id="modal-profile-avatar-preview" class="profile-avatar-display" src="./assets/default-avatar.jpg"
                    alt="Текущий аватар">

                <div class="form-group">
                    <label for="modal-username">Логин:</label>
                    <input type="text" id="modal-username" placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="modal-email">Email:</label>
                    <input type="email" id="modal-email" placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label for="modal-phone">Номер телефона:</label>
                    <input type="text" id="modal-phone" placeholder="Введите номер телефона">
                </div>
            </div>
            <div class="modal-footer">
                <p> © nexus ecosystem</p>
                <button class="app-button success-button" onclick="saveProfileChanges()">Сохранить изменения</button>
            </div>
        </div>
    </div>


    <script>
        // Firebase конфигурация (ВАЖНО: должна быть та же, что и в auth.html)
        const firebaseConfig = {
            apiKey: "AIzaSyAP04srkFeyQPsp1iuhn0RwzMav9fhqCRw", // Убедись, что это твои данные!
            authDomain: "nexus-90a19.firebaseapp.com",
            projectId: "nexus-90a19",
            storageBucket: "nexus-90a19.firebasestorage.app",
            messagingSenderId: "78051357921",
            appId: "1:78051357921:web:477ab2794b67e0c706b3a0",
            measurementId: "G-X65550ENG3"
        };

        // Инициализация Firebase (используем compat-версии)
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Элементы для отображения информации о пользователе на основной странице ---
        const userInfoText = document.getElementById("user-info");
        const userEmailSpan = document.getElementById("user-email"); // Почта, привязанная к S-ID
        const currentProfileAvatar = document.getElementById('current-profile-avatar'); // Аватар на основной странице

        const displayUsername = document.getElementById('display-username');
        const displayPhone = document.getElementById('display-phone');
        const displayEmail = document.getElementById('display-email'); // Этот элемент теперь всегда будет содержать "скрыт"


        // --- Элементы модального окна ---
        const editProfileModal = document.getElementById('edit-profile-modal');
        const modalUsernameInput = document.getElementById('modal-username');
        const modalEmailInput = document.getElementById('modal-email');
        const modalPhoneInput = document.getElementById('modal-phone');
        const modalProfileAvatarPreview = document.getElementById('modal-profile-avatar-preview'); // Аватар в модальном окне
        const modalAvatarImages = document.querySelectorAll('#edit-profile-modal .avatar-selection img'); // Аватары для выбора в модальном окне

        const defaultAvatarUrl = "./assets/default-avatar.jpg";
        let currentUser = null;
        let selectedAvatarUrl = defaultAvatarUrl; // Аватар, выбранный в модальном окне

        // --- Элементы видео-оверлея ---
        const videoOverlay = document.getElementById("video-overlay");
        const loadingVideo = document.getElementById("loading-video");

        // --- Функции для модального окна ---
        window.openEditModal = async function () {
            if (!currentUser) {
                alert("Пожалуйста, авторизуйтесь для редактирования профиля.");
                window.location.href = "auth.html";
                return;
            }

            // Заполняем поля модального окна текущими данными
            modalUsernameInput.value = displayUsername.textContent === 'Не указан' ? '' : displayUsername.textContent.trim();
            modalEmailInput.value = currentUser.email ? currentUser.email.trim() : '';
            modalPhoneInput.value = displayPhone.textContent === 'Не указан' ? '' : displayPhone.textContent.trim();

            // Устанавливаем текущий аватар в модальном окне
            modalProfileAvatarPreview.src = currentProfileAvatar.src;
            selectedAvatarUrl = currentProfileAvatar.src;

            // Отмечаем выбранный аватар в списке модального окна
            modalAvatarImages.forEach(img => {
                img.classList.remove('selected');
                if (img.dataset.avatarUrl === selectedAvatarUrl) {
                    img.classList.add('selected');
                }
            });

            editProfileModal.style.display = 'flex'; // Показать модальное окно
        };

        window.closeEditModal = function () {
            editProfileModal.style.display = 'none'; // Скрыть модальное окно
        };

        // Обработчики кликов для выбора аватара в МОДАЛЬНОМ ОКНЕ
        modalAvatarImages.forEach(img => {
            img.addEventListener('click', function () {
                selectedAvatarUrl = this.dataset.avatarUrl;
                modalProfileAvatarPreview.src = selectedAvatarUrl;
                modalAvatarImages.forEach(i => i.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        window.saveProfileChanges = async function () {
            if (!currentUser) {
                alert("Ошибка: пользователь не авторизован.");
                window.location.href = "auth.html";
                return;
            }

            const newUsername = modalUsernameInput.value.trim();
            const newEmail = modalEmailInput.value.trim();
            const newPhone = modalPhoneInput.value.trim();

            // Проверка на заполненность обязательных полей
            if (!newUsername || !newEmail) {
                alert("Имя пользователя и Email обязательны для заполнения.");
                return;
            }

            const userRef = db.collection("users").doc(currentUser.uid);

            try {
                // Обновляем DisplayName в Firebase Auth, если имя изменилось
                if (currentUser.displayName !== newUsername) {
                    await currentUser.updateProfile({
                        displayName: newUsername
                    });
                }

                // Обновляем email в Firebase Auth (если он изменился)
                if (currentUser.email !== newEmail) {
                    await currentUser.updateEmail(newEmail);
                    alert("Email обновлен. Пожалуйста, проверьте свой новый Email для подтверждения.");
                }

                // Обновляем данные в Firestore
                await userRef.set({
                    username: newUsername,
                    email: newEmail,
                    phoneNumber: newPhone,
                    avatarUrl: selectedAvatarUrl
                }, { merge: true });

                alert('Изменения профиля сохранены!');
                closeEditModal();
                await loadUserProfileData(currentUser); 	// Перезагружаем данные для отображения
            } catch (error) {
                console.error("Ошибка при сохранении изменений профиля:", error);
                let errorMessage = "Произошла ошибка при сохранении изменений.";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Этот Email уже используется другим аккаунтом.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Некорректный формат Email.';
                } else if (error.code === 'auth/requires-recent-login') {
                    errorMessage = 'Пожалуйста, войдите в систему еще раз, чтобы изменить Email (требуется недавний вход).';
                }
                alert(errorMessage + " " + error.message);
            }
        };


        async function loadUserProfileData(user) {
            currentUser = user;
            console.log("--- Загрузка данных профиля ---");
            console.log("Current user UID:", user.uid);
            console.log("Current user Email:", user.email);
            userEmailSpan.textContent = user.email;

            const userRef = db.collection("users").doc(user.uid);
            console.log("Firestore User Ref Path:", userRef.path);
            console.log("Attempting to get document from Firestore...");

            try {
                const docSnap = await userRef.get();

                if (docSnap.exists) {
                    console.log("User document exists! Data:", docSnap.data());
                    const userData = docSnap.data();
                    displayUsername.textContent = userData.username || 'Не указан';
                    displayPhone.textContent = userData.phoneNumber || 'Не указан';
                    if (userData.avatarUrl) {
                        currentProfileAvatar.src = userData.avatarUrl;
                    }
                } else {
                    console.warn("User document DOES NOT exist in Firestore for UID:", user.uid);
                    displayUsername.textContent = 'Не указан';
                    displayPhone.textContent = 'Не указан';
                    currentProfileAvatar.src = defaultAvatarUrl;
                }
            } catch (error) {
                console.error("⛔️ ОШИБКА FIREBASE ПРИ ЗАГРУЗКЕ ПРОФИЛЯ:", error);
            }
        }

        // --- Обработчик состояния аутентификации ---
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                await loadUserProfileData(user);
                // Загрузка данных профиля происходит, но оверлей скрывается независимо по таймеру
            } else {
                console.log("Пользователь не авторизован, перенаправляем на auth.html");
                window.location.href = "auth.html";
            }
        });

        // --- Функция выхода из аккаунта ---
        window.logout = function () {
            auth.signOut().then(() => {
                alert("Вы вышли из аккаунта");
                window.location.href = "home-page.html";
            }).catch((error) => {
                console.error("Ошибка при выходе:", error);
                alert("Произошла ошибка при выходе.");
            });
        };

        // --- Обработчик окончания видео загрузки, контролирующий ВРЕМЯ ПОКАЗА ВИДЕО ---
        document.addEventListener("DOMContentLoaded", () => {
            // Убедимся, что оверлей изначально показан
            videoOverlay.style.display = "flex";

            // Запускаем скрытие оверлея через 2 секунды (время показа видео)
            setTimeout(() => {
                videoOverlay.classList.add("hidden"); // Запускаем анимацию исчезновения (opacity: 0)

                // Через 0.3 секунды после начала исчезновения (это время transition)
                // полностью скрываем элемент, чтобы он не мешал взаимодействию
                setTimeout(() => {
                    videoOverlay.style.display = "none";
                }, 300); // <-- ВРЕМЯ ИСЧЕЗНОВЕНИЯ (совпадает со значением transition в CSS)
            }, 2000); // <-- ВРЕМЯ ПОКАЗА ВИДЕО (2 секунды)
        });
    </script>
</body>

</html>
